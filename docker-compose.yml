version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: postgres-langgraph
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres

    ports:
      - "5442:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: